<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <!-- Valodu izvēle -->
    <div class="language-selector">
        <button class="lang-btn active" data-lang="lv">LV</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="eo">EO</button>
    </div>
    
    <h1>🔒 PermRepo</h1>
    <p class="subtitle" data-i18n="subtitle">GitHub repo backupi uz Arweave</p>
    
    <!-- Abonementa status -->
    <div id="subscriptionSection" style="display: none;">
        <button id="subscriptionButton" class="subscription-button" disabled></button>
    </div>
    
    <!-- GitHub auth -->
    <div id="authSection" style="display: none;">
        <button id="loginButton" class="sign-button" data-i18n="connect-github">Savienot ar GitHub</button>
    </div>
    
    <!-- User info -->
    <div id="userSection" style="display: none;">
        <div class="info-row text-left">
            <span class="info-label" data-i18n="user">Lietotājs</span>
            <span class="info-value" id="userName">-</span>
        </div>
        <button id="logoutButton" class="logout-button" data-i18n="logout">Izrakstīties</button>
    </div>
    
    <!-- Wallet -->
    <div id="walletSection" style="display: none;">
        <div class="info-row text-left">
            <span class="info-label" data-i18n="wallet">Maks</span>
            <span class="info-value word-break" id="walletAddress">-</span>
        </div>
        <button id="connectWalletButton" class="sign-button" data-i18n="connect-wallet">Savienot maku</button>
    </div>
    
    <!-- Repo izvēle -->
    <div id="repoSection" style="display: none;">
        <div class="info-row text-left">
            <label for="repoSelect" class="info-label" data-i18n="repository">Repozitorijs</label>
            <select id="repoSelect" class="repo-select" aria-label="Izvēlies repozitoriju">
                <option value="" data-i18n="select-repo">Izvēlies repozitoriju...</option>
            </select>
        </div>
        
        <!-- Repo status -->
        <div id="repoActions" style="display: none;">
            <div id="repoStatus" class="repo-status-display"></div>
            <button id="actionButton" class="sign-button gradient-button" style="display: none;"></button>
        </div>
    </div>
    
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" integrity="sha256-dOAMPiqczTEubVFU+cywkR0bNMtJvIIgJEopKgp3PCE=" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
