<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Atjaunošana</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0d1117 0%, #161b22 30%, #1a1e24 60%, #0d1117 100%); 
            color: #e6edf3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        .container { 
            background: linear-gradient(180deg, #1a1e24 0%, #161b22 40%, #1c2128 70%, #161b22 100%); 
            border: 1px solid #30363d; 
            border-radius: 16px; 
            padding: 40px; 
            max-width: 640px; 
            width: 100%; 
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .language-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
        .lang-btn { 
            width: auto; 
            padding: 8px 16px; 
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff; 
            font-size: 18px; 
            font-weight: 600;
            cursor: pointer; 
            margin: 0; 
            transition: all 0.3s ease; 
            letter-spacing: 1px;
        }
        .lang-btn:hover { color: #79c0ff; transform: scale(1.15); }
        .lang-btn.active { 
            color: #79c0ff; 
            font-weight: 700;
            background: linear-gradient(180deg, rgba(121, 192, 255, 0.15) 0%, rgba(121, 192, 255, 0.05) 100%); 
            border-color: rgba(121, 192, 255, 0.4); 
        }

        h1 { 
            font-size: 32px; 
            margin-bottom: 8px; 
            background: linear-gradient(135deg, #79c0ff 0%, #a5d6ff 50%, #79c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center; 
        }
        .subtitle { color: #ffffff; margin-bottom: 24px; font-size: 16px; text-align: center; }

        .info-row { 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            padding: 16px 0; 
            border-bottom: 1px solid #30363d;
            margin-bottom: 8px;
        }
        .info-label { 
            color: #8b949e; 
            font-size: 14px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-value { font-weight: 600; font-size: 16px; word-break: break-all; color: #ffffff; padding: 4px 0; }

        input, textarea { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            border: none;
            border-bottom: 2px solid #30363d;
            color: #ffffff; 
            font-size: 16px; 
            margin-top: 8px; 
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-bottom-color: #79c0ff; }
        input::placeholder, textarea::placeholder { color: #8b949e; }
        textarea { min-height: 80px; resize: vertical; font-family: monospace; font-size: 14px; }

        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #238636 0%, #1a7f37 50%, #238636 100%); 
            color: #ffffff; 
            border: 1px solid rgba(63, 185, 80, 0.3);
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 16px; 
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }
        button:hover::before { left: 100%; }
        button:hover { 
            background: linear-gradient(135deg, #2ea043 0%, #238636 50%, #2ea043 100%); 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }
        button:disabled { 
            background: linear-gradient(135deg, #30363d 0%, #21262d 50%, #30363d 100%); 
            color: #8b949e; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        .progress { width: 100%; height: 20px; background: #21262d; border-radius: 10px; margin: 16px 0; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #238636, #2ea043); transition: width 0.3s; }

        .status { text-align: center; margin-top: 16px; font-size: 14px; color: #ffffff; white-space: pre-wrap; word-break: break-all; }
        .error { color: #f85149; margin-top: 12px; text-align: center; font-size: 14px; }
        .success { color: #3fb950; margin-top: 12px; text-align: center; font-size: 14px; }
        .debug-info { margin: 12px 0; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; font-size: 12px; max-height: 200px; overflow-y: auto; display: none; color: #8b949e; }
        a { color: #79c0ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-selector">
            <button class="lang-btn" data-lang="lv">LV</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="eo">EO</button>
        </div>
        
        <h1 data-i18n="restore-title">🔓 PermRepo Atjaunošana</h1>
        <p class="subtitle" data-i18n="restore-subtitle">Atjauno GitHub repo no Arweave — bez servera!</p>
        
        <div class="info-row">
            <span class="info-label" data-i18n="wallet-label">Savienotais maks</span>
            <span class="info-value" id="walletStatus" data-i18n="wallet-not-connected">Nav savienots</span>
        </div>
        <button id="connectWalletBtn" onclick="connectWallet()" data-i18n="connect-wallet">🔌 Savienot maku</button>
        
        <div id="manifestSection" style="display: none;">
            <div class="info-row">
                <span class="info-label" data-i18n="manifest-label">Arweave manifests (TX ID vai ar://)</span>
            </div>
            <input type="text" id="manifestInput" data-i18n-placeholder="manifest-placeholder" placeholder="ar://ABC123... vai https://ar-io.dev/raw/ABC123...">
            
            <button id="verifyBtn" onclick="verifyNFTOwnership()" data-i18n="verify-nft">Pārbaudīt NFT īpašumtiesības</button>
        </div>
        
        <div id="nftVerificationSection" style="display: none;">
            <div id="nftVerificationStatus" class="status"></div>
        </div>
        
        <div id="masterKeySection" style="display: none;">

            </div>
            <textarea id="masterKeyInput" data-i18n-placeholder="master-key-placeholder" placeholder="Ievadi savu master atslēgu..."></textarea>
            
            <button id="restoreBtn" onclick="restoreRepo()" data-i18n="restore-btn">📥 Atjaunot repozitoriju</button>
        </div>
        
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        
        <div id="status" class="status"></div>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha256-rMfkFFWoB2W1/Zx+4bgHim0WC7vKRVrq6FTeZclH1Z4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" integrity="sha256-dOAMPiqczTEubVFU+cywkR0bNMtJvIIgJEopKgp3PCE=" crossorigin="anonymous"></script>

        let signer = null;
        let currentLanguage = localStorage.getItem('permrepo-language') || 'lv';
        let CONFIG = {};
        let manifestData = null;
        let isAuthorized = false;
        let nftTokenId = null;

            "function ownerOf(uint256 tokenId) external view returns (address)"
        ];

        };
        
        function t(key) {
            return translations[currentLanguage][key] || translations.lv[key] || key;
        }
        
        function switchLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('permrepo-language', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }
        
        function showStatus(msg, type = 'status') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
        }
        
        function showDebug(msg) {
            const el = document.getElementById('debugInfo');
            el.style.display = 'block';
            el.innerHTML += msg + '<br>';
            el.scrollTop = el.scrollHeight;
        }
        
        function showProgress(percent) {
            document.getElementById('progress').style.display = 'block';
            document.getElementById('progressBar').style.width = percent + '%';
        }
        
        function hideProgress() {
            document.getElementById('progress').style.display = 'none';
        }
        
        async function fetchFromArweave(txId, gatewayIndex = 0) {
            if (gatewayIndex >= GATEWAYS.length) throw new Error(t('fetch-error'));
            
            const gateway = GATEWAYS[gatewayIndex];
            
            try {
                const response = await fetch(`${gateway}/raw/${txId}`);
                if (response.ok) return await response.arrayBuffer();
            } catch (e) {}
            
            return fetchFromArweave(txId, gatewayIndex + 1);
        }
        
        async function connectWallet() {
            if (!window.ethereum) {
                showStatus('❌ Lūdzu instalē maku!', 'error');
                return;
            }
            
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                
                document.getElementById('walletStatus').textContent = `${t('wallet-connected')}: ${userAddress.substring(0, 10)}...`;
                
                document.getElementById('manifestSection').style.display = 'block';
                
                showStatus('✅', 'success');
            } catch (e) {
                showStatus('❌ ' + e.message, 'error');
            }
        }
        
        async function verifyNFTOwnership() {
            const manifestInput = document.getElementById('manifestInput').value.trim();
            
            if (!manifestInput) {
                showStatus(t('enter-manifest'), 'error');
                return;
            }
            
            if (!signer) {
                showStatus(t('connect-first'), 'error');
                return;
            }
            
            let manifestTxId = manifestInput;
            if (manifestInput.startsWith('ar://')) manifestTxId = manifestInput.slice(5);
            else if (manifestInput.includes('/raw/')) manifestTxId = manifestInput.split('/raw/')[1];
            else if (manifestInput.includes('ar-io.dev/')) manifestTxId = manifestInput.split('ar-io.dev/')[1];
            else if (manifestInput.includes('arweave.net/')) manifestTxId = manifestInput.split('arweave.net/')[1];
            
            showStatus(t('download-manifest'), 'status');
            showProgress(10);
            
            try {
                const manifestBuffer = await fetchFromArweave(manifestTxId);
                const manifestText = new TextDecoder().decode(manifestBuffer);
                manifestData = JSON.parse(manifestText);
                
                const repoName = manifestData.metadata?.repo;
                if (!repoName) {
                    throw new Error(t('invalid-manifest'));
                }
                
                showDebug('Repo: ' + repoName);
                
                const repoHash = ethers.keccak256(
                    ethers.AbiCoder.defaultAbiCoder().encode(['string'], [repoName])
                );
                
                if (!CONFIG.nftAddress) {
                    const configResponse = await fetch('/api/config');
                    CONFIG = await configResponse.json();
                }
                
                showStatus(t('nft-verifying'), 'status');
                showProgress(20);
                
                const provider = new ethers.BrowserProvider(window.ethereum);
                const nftContract = new ethers.Contract(CONFIG.nftAddress, NFT_ABI, provider);
                
                nftTokenId = await nftContract.repositoryTokens(repoHash);
                
                if (nftTokenId === 0n) {
                    throw new Error(t('nft-not-found'));
                }
                
                const nftOwner = await nftContract.ownerOf(nftTokenId);
                
                if (nftOwner.toLowerCase() !== userAddress.toLowerCase()) {
                    throw new Error(t('nft-not-found'));
                }
                
                showDebug('✅ NFT Token ID: ' + nftTokenId.toString());
                showDebug('✅ NFT Owner: ' + nftOwner);
                
                showStatus(t('signing-challenge'), 'status');
                showProgress(30);
                
                const challenge = [
                    'PermRepo Restore Challenge',
                    `Token ID: ${nftTokenId}`,
                    `Wallet: ${userAddress}`,
                    `Timestamp: ${Date.now()}`
                ].join('\n');
                
                const signature = await signer.signMessage(challenge);
                
                const recoveredAddress = ethers.verifyMessage(challenge, signature);
                
                if (recoveredAddress.toLowerCase() !== userAddress.toLowerCase()) {
                    throw new Error(t('signature-failed'));
                }
                
                showDebug('✅ Paraksts verificēts: ' + recoveredAddress);
                
                isAuthorized = true;
                
                document.getElementById('nftVerificationSection').style.display = 'block';
                document.getElementById('nftVerificationStatus').textContent = t('nft-found');
                document.getElementById('nftVerificationStatus').className = 'status success';
                
                document.getElementById('masterKeySection').style.display = 'block';
                
                showProgress(40);
                showStatus(t('signature-verified'), 'success');
                
            } catch (e) {
                hideProgress();
                document.getElementById('nftVerificationSection').style.display = 'block';
                document.getElementById('nftVerificationStatus').textContent = e.message;
                document.getElementById('nftVerificationStatus').className = 'status error';
                showStatus('❌ ' + e.message, 'error');
            }
        }
        
        function getMasterKeyFromInput() {
            const input = document.getElementById('masterKeyInput').value.trim();
            if (!input) throw new Error(t('enter-master-key'));
            if (input.startsWith('0x')) return input;
            return '0x' + input;
        }
        
        async function importAESKey(keyHex) {
            const keyBytes = ethers.getBytes(keyHex);
            if (keyBytes.length !== 32) throw new Error('Invalid Master Key');
            
            return await crypto.subtle.importKey(
                'raw', keyBytes, 'AES-GCM', false, ['decrypt']
            );
        }
        
        async function decryptData(encryptedData, iv, keyHex) {
            const cryptoKey = await importAESKey(keyHex);
            const ivBytes = new Uint8Array(iv);
            const dataBytes = new Uint8Array(encryptedData);
            
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: ivBytes },
                cryptoKey,
                dataBytes
            );
            
            return new Uint8Array(decrypted);
        }
        
        async function restoreRepo() {
            if (!isAuthorized) {
                showStatus(t('authorization-required'), 'error');
                return;
            }
            
            const masterKey = getMasterKeyFromInput();
            
            if (!manifestData) {
                showStatus(t('invalid-manifest'), 'error');
                return;
            }
            
            const button = document.getElementById('restoreBtn');
            button.disabled = true;
            button.textContent = '⏳';
            
            document.getElementById('debugInfo').innerHTML = '';
            document.getElementById('debugInfo').style.display = 'none';
            
            try {
                const manifest = manifestData;
                
                if (!manifest.paths) throw new Error(t('invalid-manifest'));
                
                showDebug('Failu skaits paths: ' + Object.keys(manifest.paths).length);
                
                const encryptionIVs = manifest.encryption?.ivs || {};
                const zipIds = new Set();
                const fileZipMap = {};
                
                for (const [filePath, info] of Object.entries(manifest.paths)) {
                    const zipId = info.zipId || info.id;
                    if (zipId) {
                        zipIds.add(zipId);
                        fileZipMap[filePath] = zipId;
                    }
                }
                
                showDebug('Unikālie ZIP: ' + zipIds.size);
                
                showStatus(`${t('download-zip')} (${zipIds.size})`, 'status');
                showProgress(40);
                
                const zipContents = {};
                let zipIndex = 0;
                
                for (const zipId of zipIds) {
                    const zipBuffer = await fetchFromArweave(zipId);
                    let decryptedZipBuffer = zipBuffer;
                    
                    const iv = encryptionIVs[zipId];
                    if (iv && Array.isArray(iv) && iv.length === 12) {
                        try {
                            decryptedZipBuffer = await decryptData(zipBuffer, iv, masterKey);
                            showDebug('✅ Atšifrēts: ' + zipId);
                        } catch (e) {
                            showDebug('⚠️ ' + zipId + ': ' + e.message);
                        }
                    }
                    
                    try {
                        const zip = await JSZip.loadAsync(decryptedZipBuffer);
                        zipContents[zipId] = zip;
                        showDebug('✅ Izpakots: ' + zipId);
                    } catch (e) {
                        showDebug('❌ ' + zipId + ': ' + e.message);
                    }
                    
                    zipIndex++;
                    showProgress(40 + (zipIndex / zipIds.size) * 30);
                }
                
                showStatus(t('extracting'), 'status');
                showProgress(70);
                
                const finalFiles = {};
                
                for (const [filePath, zipId] of Object.entries(fileZipMap)) {
                    const zip = zipContents[zipId];
                    if (!zip) continue;
                    
                    let fileData = null;
                    if (zip.file(filePath)) {
                        fileData = await zip.file(filePath).async('uint8array');
                    } else {
                        const fileName = filePath.split('/').pop();
                        const matchingFile = Object.values(zip.files).find(f => 
                            f.name === fileName || f.name.endsWith('/' + fileName)
                        );
                        if (matchingFile && !matchingFile.dir) fileData = await matchingFile.async('uint8array');
                    }
                    
                    if (fileData) finalFiles[filePath] = fileData;
                }
                
                showDebug('Kopā atjaunoti: ' + Object.keys(finalFiles).length);
                
                showStatus(`${t('creating-zip')} ${Object.keys(finalFiles).length}`, 'status');
                showProgress(85);
                
                const finalZip = new JSZip();
                for (const [filePath, data] of Object.entries(finalFiles)) {
                    finalZip.file(filePath, data);
                }
                
                const finalBlob = await finalZip.generateAsync({ type: 'blob' });
                
                showProgress(100);
                
                const repoName = manifest.metadata?.repo || 'repo';
                const url = URL.createObjectURL(finalBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${repoName}-atjaunots.zip`;
                a.click();
                URL.revokeObjectURL(url);
                
                hideProgress();
                showStatus(`${t('restore-complete')}\n${t('files-restored')}: ${Object.keys(finalFiles).length}\n${t('zip-archives')}: ${zipIds.size}`, 'success');
                
            } catch (e) {
                console.error('Kļūda:', e);
                hideProgress();
                showStatus(`${t('error')}: ${e.message}`, 'error');
            } finally {
                button.disabled = false;
                button.textContent = t('restore-btn');
            }
        }
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLanguage);
            btn.onclick = () => switchLanguage(btn.dataset.lang);
        });
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
        
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.placeholder = t(el.dataset.i18nPlaceholder);
        });
    </script>
</body>
</html>
