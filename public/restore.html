<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Atjaunošana</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; max-width: 640px; width: 100%; }
        h1 { text-align: center; color: #79c0ff; margin-bottom: 8px; font-size: 24px; }
        .subtitle { text-align: center; color: #b0b8c4; margin-bottom: 24px; font-size: 14px; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #21262d; }
        .info-label { color: #b0b8c4; }
        .info-value { font-weight: 600; font-size: 14px; word-break: break-all; }
        input, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 16px; margin-top: 8px; margin-bottom: 16px; }
        input:focus, textarea:focus { outline: none; border-color: #58a6ff; }
        textarea { min-height: 80px; resize: vertical; font-family: monospace; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #238636; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; transition: background 0.2s; }
        button:hover { background: #2ea043; }
        button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
        .progress { width: 100%; height: 20px; background: #21262d; border-radius: 10px; margin: 16px 0; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: #238636; transition: width 0.3s; }
        .status { text-align: center; margin-top: 16px; font-size: 14px; color: #b0b8c4; white-space: pre-wrap; word-break: break-all; }
        .error { color: #f85149; margin-top: 12px; text-align: center; font-size: 14px; }
        .success { color: #3fb950; margin-top: 12px; text-align: center; font-size: 14px; }
        .debug-info { margin: 12px 0; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; font-size: 12px; max-height: 200px; overflow-y: auto; display: none; color: #8b949e; }
        a { color: #79c0ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 PermRepo Atjaunošana</h1>
        <p class="subtitle">Atjauno GitHub repo no Arweave — bez servera!</p>
        
        <div class="info-row">
            <span class="info-label">Arweave manifests (TX ID vai ar://)</span>
        </div>
        <input type="text" id="manifestInput" placeholder="Piem.: ar://ABC123... vai https://ar-io.dev/raw/ABC123...">
        
        <div class="info-row">
            <span class="info-label">Master atslēga</span>
        </div>
        <textarea id="masterKeyInput" placeholder="Ievadi savu master atslēgu..."></textarea>
        
        <div class="info-row">
            <span class="info-label">Savienotais maks</span>
            <span class="info-value" id="walletStatus">Nav savienots</span>
        </div>
        <button id="connectWalletBtn" onclick="connectWallet()">🔌 Savienot MetaMask</button>
        
        <button id="restoreBtn" onclick="restoreRepo()" disabled>📥 Atjaunot repozitoriju</button>
        
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        
        <div id="status" class="status"></div>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
    
    <script>
        const { ethers } = window;
        
        const GATEWAYS = [
            'https://ar-io.dev',
            'https://arweave.net'
        ];
        
        let userAddress = null;
        let signer = null;
        
        function showStatus(msg, type = 'status') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
        }
        
        function showDebug(msg) {
            const el = document.getElementById('debugInfo');
            el.style.display = 'block';
            el.innerHTML += msg + '<br>';
            el.scrollTop = el.scrollHeight;
        }
        
        function showProgress(percent) {
            document.getElementById('progress').style.display = 'block';
            document.getElementById('progressBar').style.width = percent + '%';
        }
        
        function hideProgress() {
            document.getElementById('progress').style.display = 'none';
        }
        
        async function fetchFromArweave(txId, gatewayIndex = 0) {
            if (gatewayIndex >= GATEWAYS.length) {
                throw new Error('Neizdevās lejupielādēt no Arweave');
            }
            
            const gateway = GATEWAYS[gatewayIndex];
            
            try {
                showDebug(`Mēģina: ${gateway}/raw/${txId}`);
                const response = await fetch(`${gateway}/raw/${txId}`);
                
                if (response.ok) {
                    showDebug(`✅ Veiksmīgi: ${gateway}/raw/${txId} (${response.status})`);
                    return await response.arrayBuffer();
                } else {
                    showDebug(`❌ ${gateway} atbilde: ${response.status}`);
                }
            } catch (e) {
                showDebug(`❌ ${gateway} kļūda: ${e.message}`);
            }
            
            return fetchFromArweave(txId, gatewayIndex + 1);
        }
        
        async function connectWallet() {
            if (!window.ethereum) {
                showStatus('❌ Lūdzu instalē MetaMask!', 'error');
                return;
            }
            
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                
                document.getElementById('walletStatus').textContent = userAddress.substring(0, 10) + '...';
                document.getElementById('restoreBtn').disabled = false;
                
                showStatus('✅ Maks savienots!', 'success');
            } catch (e) {
                showStatus('❌ Kļūda savienojot: ' + e.message, 'error');
            }
        }
        
        function getMasterKeyFromInput() {
            const input = document.getElementById('masterKeyInput').value.trim();
            if (!input) {
                throw new Error('Ievadi master atslēgu!');
            }
            
            if (input.startsWith('0x')) {
                return input;
            }
            
            return '0x' + input;
        }
        
        async function importAESKey(keyHex) {
            const key = keyHex.slice(2);
            const keyBytes = new Uint8Array(32);
            for (let i = 0; i < 32; i++) {
                keyBytes[i] = parseInt(key.substring(i * 2, i * 2 + 2), 16);
            }
            
            return await crypto.subtle.importKey(
                'raw', keyBytes, 'AES-GCM', false, ['decrypt']
            );
        }
        
        async function decryptData(encryptedData, iv, keyHex) {
            const cryptoKey = await importAESKey(keyHex);
            const ivBytes = new Uint8Array(iv);
            const dataBytes = new Uint8Array(encryptedData);
            
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: ivBytes },
                cryptoKey,
                dataBytes
            );
            
            return new Uint8Array(decrypted);
        }
        
        async function restoreRepo() {
            const manifestInput = document.getElementById('manifestInput').value.trim();
            const masterKey = getMasterKeyFromInput();
            
            if (!manifestInput) {
                showStatus('❌ Ievadi manifesta TX ID vai ar:// saiti!', 'error');
                return;
            }
            
            if (!signer) {
                showStatus('❌ Vispirms savieno MetaMask!', 'error');
                return;
            }
            
            // 1. Izgūst manifesta TX ID
            let manifestTxId = manifestInput;
            if (manifestInput.startsWith('ar://')) {
                manifestTxId = manifestInput.slice(5);
            } else if (manifestInput.includes('/raw/')) {
                manifestTxId = manifestInput.split('/raw/')[1];
            } else if (manifestInput.includes('ar-io.dev/')) {
                manifestTxId = manifestInput.split('ar-io.dev/')[1];
            } else if (manifestInput.includes('arweave.net/')) {
                manifestTxId = manifestInput.split('arweave.net/')[1];
            }
            
            const button = document.getElementById('restoreBtn');
            button.disabled = true;
            button.textContent = '⏳ Atjauno...';
            
            document.getElementById('debugInfo').innerHTML = '';
            document.getElementById('debugInfo').style.display = 'none';
            
            try {
                // 2. Lejupielādē pēdējo manifestu
                showStatus('📥 Lejupielādē manifestu...', 'status');
                showProgress(5);
                
                const manifestBuffer = await fetchFromArweave(manifestTxId);
                const manifestText = new TextDecoder().decode(manifestBuffer);
                showDebug('Manifests (pirmie 500 simboli): ' + manifestText.substring(0, 500));
                
                const manifest = JSON.parse(manifestText);
                
                if (!manifest.paths) {
                    throw new Error('Nederīgs manifests!');
                }
                
                showDebug('Failu skaits paths: ' + Object.keys(manifest.paths).length);
                showDebug('Backup numurs: ' + manifest.metadata?.backupNumber);
                
                // 3. Iegūst IV vēsturi
                const encryptionIVs = manifest.encryption?.ivs || {};
                showDebug('IV vēstures ieraksti: ' + Object.keys(encryptionIVs).length);
                
                // 4. Savāc visus unikālos ZIP ID
                const zipIds = new Set();
                const fileZipMap = {};
                
                for (const [filePath, info] of Object.entries(manifest.paths)) {
                    const zipId = info.zipId || info.id;
                    if (zipId) {
                        zipIds.add(zipId);
                        fileZipMap[filePath] = zipId;
                    }
                }
                
                showDebug('Unikālie ZIP faili: ' + zipIds.size);
                
                // 5. Lejupielādē un atšifrē katru ZIP ar ATBILSTOŠO IV
                showStatus(`📦 Lejupielādē ${zipIds.size} ZIP arhīvus...`, 'status');
                showProgress(20);
                
                const zipContents = {};
                let zipIndex = 0;
                
                for (const zipId of zipIds) {
                    showDebug(`Lejupielādē ZIP: ${zipId}`);
                    
                    const zipBuffer = await fetchFromArweave(zipId);
                    
                    let decryptedZipBuffer = zipBuffer;
                    
                    // Atrod IV šim ZIP no ivs vēstures
                    const iv = encryptionIVs[zipId];
                    
                    if (iv && Array.isArray(iv) && iv.length === 12) {
                        try {
                            decryptedZipBuffer = await decryptData(zipBuffer, iv, masterKey);
                            showDebug(`✅ ZIP atšifrēts ar IV: ${zipId}`);
                        } catch (e) {
                            showDebug(`⚠️ Neizdevās atšifrēt ${zipId}: ${e.message}`);
                            decryptedZipBuffer = zipBuffer;
                        }
                    } else {
                        showDebug(`ZIP nav šifrēts vai nav IV: ${zipId}`);
                    }
                    
                    try {
                        const zip = await JSZip.loadAsync(decryptedZipBuffer);
                        zipContents[zipId] = zip;
                        showDebug(`✅ ZIP izpakots: ${zipId}`);
                    } catch (e) {
                        showDebug(`❌ Neizdevās izpakot ${zipId}: ${e.message}`);
                    }
                    
                    zipIndex++;
                    showProgress(20 + (zipIndex / zipIds.size) * 40);
                }
                
                // 6. Izvelk failus
                showStatus('📂 Izvelk failus...', 'status');
                showProgress(60);
                
                const finalFiles = {};
                
                for (const [filePath, zipId] of Object.entries(fileZipMap)) {
                    const zip = zipContents[zipId];
                    
                    if (!zip) continue;
                    
                    let fileData = null;
                    
                    if (zip.file(filePath)) {
                        fileData = await zip.file(filePath).async('uint8array');
                    } else {
                        const
