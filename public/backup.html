<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Backups</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <!-- Valodu izvēle -->
    <div class="language-selector">
        <button class="lang-btn" data-lang="lv">LV</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="eo">EO</button>
    </div>
    
    <img src="icons/logo-nosaukums.svg" alt="PermRepo" class="logo-title">
    <p class="subtitle" id="repoTitle">Repozitorijs: -</p>
    
    <div class="info-row text-left">
        <span class="info-label" data-i18n="nft-token">NFT Token ID</span>
        <span class="info-value" id="nftTokenId">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label" data-i18n="backup-count">Backupu skaits</span>
        <span class="info-value" id="backupCount">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label" data-i18n="last-manifest">Pēdējais manifests</span>
        <span class="info-value" id="lastManifest">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label" data-i18n="last-merkle">Pēdējā Merkle sakne</span>
        <span class="info-value" id="lastMerkleRoot">-</span>
    </div>
    
    <button id="startBackupButton" class="sign-button backup-button" data-i18n="start-backup" disabled>Sākt backupu</button>
    
    <!-- Jaunā statusa kartīte -->
    <div class="status-card" id="statusCard" style="display: none;">
        <span class="status-icon" id="statusIcon"></span>
        <div id="statusContent"></div>
    </div>
    
    <div class="error" id="error" style="display: none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" integrity="sha256-dOAMPiqczTEubVFU+cywkR0bNMtJvIIgJEopKgp3PCE=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha256-rMfkFFWoB2W1/Zx+4bgHim0WC7vKRVrq6FTeZclH1Z4=" crossorigin="anonymous"></script>
<script type="module" src="js/backup.js"></script>
</body>
</html>
