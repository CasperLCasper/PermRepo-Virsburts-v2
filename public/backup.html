<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Backups</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>📦 PermRepo Backups</h1>
    <p class="subtitle" id="repoTitle">Repozitorijs: -</p>
    
    <div class="info-row text-left">
        <span class="info-label">NFT Token ID</span>
        <span class="info-value" id="nftTokenId">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Backupu skaits</span>
        <span class="info-value" id="backupCount">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Pēdējais manifests</span>
        <span class="info-value" id="lastManifest">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Pēdējā Merkle sakne</span>
        <span class="info-value" id="lastMerkleRoot">-</span>
    </div>
    
    <button id="startBackupButton" class="sign-button" disabled>Sākt backupu</button>
    
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="js/backup.js"></script>
</body>
</html>
