<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Upload Restore uz Arweave</title>
</head>
<body>
    <h1>Upload restore.html uz Arweave</h1>
    
    <button id="uploadBtn">Augšupielādēt</button>
    
    <div id="status"></div>

    <script>
        document.getElementById('uploadBtn').addEventListener('click', async function() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '⏳ Augšupielādē...';
            
            try {
                const response = await fetch('/api/upload-restore', { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    statusEl.textContent = '✅ TX ID: ' + result.txId + '\n\nURL: https://ar-io.dev/' + result.txId;
                } else {
                    statusEl.textContent = '❌ ' + (result.error || 'Kļūda');
                }
                
            } catch (e) {
                console.error('Kļūda:', e);
                statusEl.textContent = '❌ ' + e.message;
            }
        });
    </script>
</body>
</html>
