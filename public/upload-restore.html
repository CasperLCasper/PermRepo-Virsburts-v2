<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Restore uz Arweave</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .status { margin-top: 20px; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Upload restore.html uz Arweave</h1>
    
    <button onclick="uploadRestore()">Augšupielādēt restore.html</button>
    
    <div id="status" class="status"></div>

    <script type="module">
        import { TurboFactory, EthereumSigner } from 'https://cdn.jsdelivr.net/npm/@ardrive/turbo-sdk@latest/dist/index.js';
        
        window.uploadRestore = async function() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '⏳ Augšupielādē...';
            
            try {
                const RESTORE_PAGE_PRIVATE_KEY = prompt('Ievadi RESTORE_PAGE_PRIVATE_KEY:');
                if (!RESTORE_PAGE_PRIVATE_KEY) {
                    statusEl.textContent = '❌ Nav atslēgas!';
                    statusEl.className = 'status error';
                    return;
                }
                
                const turbo = TurboFactory.authenticated({
                    signer: new EthereumSigner(RESTORE_PAGE_PRIVATE_KEY),
                    token: 'base-eth',
                    gatewayUrl: 'https://sepolia.base.org',
                    uploadServiceConfig: { url: 'https://upload.services.ar-io.dev' },
                    paymentServiceConfig: { url: 'https://payment.services.ar-io.dev' }
                });
                
                // Iegūst restore.html saturu
                const response = await fetch('/restore.html');
                const htmlText = await response.text();
                const fileBuffer = new TextEncoder().encode(htmlText);
                
                const result = await turbo.uploadFile({
                    fileStreamFactory: () => new Blob([fileBuffer]).stream(),
                    fileSizeFactory: () => fileBuffer.length,
                    dataItemOpts: {
                        tags: [
                            { name: 'App-Name', value: 'PermRepo' },
                            { name: 'Type', value: 'restore-page' },
                            { name: 'Content-Type', value: 'text/html' },
                            { name: 'Title', value: 'PermRepo Restore' }
                        ]
                    }
                });
                
                statusEl.textContent = `✅ TX ID: ${result.id}`;
                statusEl.className = 'status success';
                
            } catch (e) {
                statusEl.textContent = '❌ ' + e.message;
                statusEl.className = 'status error';
            }
        };
    </script>
</body>
</html>
